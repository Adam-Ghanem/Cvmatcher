services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cvmatcher
      POSTGRES_USER: cvmatcher
      POSTGRES_PASSWORD: cvmatcher
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvmatcher -d cvmatcher"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
