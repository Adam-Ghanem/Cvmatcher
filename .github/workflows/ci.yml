name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:lint
      - run: pnpm web:typecheck
      - run: pnpm web:test
      - run: pnpm web:build

  api:
    name: API quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cvmatcher
          POSTGRES_PASSWORD: cvmatcher
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U cvmatcher -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      CV_MATCHER_APP_ENV: test
      CV_MATCHER_DATABASE_URL: postgresql://cvmatcher:cvmatcher@localhost:5432/cvmatcher_test
      CV_MATCHER_CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'
      CV_MATCHER_SESSION_HMAC_SECRET: test-only-session-secret-that-is-at-least-thirty-two-bytes
      CV_MATCHER_PRIVATE_STORAGE_ROOT: .local-storage-test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: PGPASSWORD=cvmatcher psql -h localhost -U cvmatcher -d postgres -c 'CREATE DATABASE cvmatcher_test;'
      - run: alembic upgrade head
      - run: ruff check .
      - run: mypy app
      - run: pytest
